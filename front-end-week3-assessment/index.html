<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Todo Application</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:white;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:700px;
      background:white;
      padding:30px;
      border-radius:20px;
      box-shadow:0 5px 20px rgba(0,0,0,0.1);
    }

    .title{
      text-align:center;
      margin-bottom:25px;
    }

    .title h1{
      color:#0a0000;
      font-size:38px;
      margin-bottom:5px;
    }

    .title p{
      color:#64748b;
    }

    .input-section{
      display:flex;
      gap:10px;
      margin-bottom:25px;
    }

    .input-section input{
      flex:1;
      padding:14px;
      border:1px solid #dbeafe;
      border-radius:10px;
      outline:none;
      font-size:16px;
    }

    .input-section button{
      background:#6366f1;
      color:white;
      border:none;
      padding:14px 22px;
      border-radius:10px;
      cursor:pointer;
      font-size:16px;
      transition:0.3s;
    }

    .input-section button:hover{
      background:#4f46e5;
    }

    .task-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:15px;
    }

    .task-header h3{
      color:#334155;
    }

    .clear-btn{
      background:none;
      border:none;
      color:#ef4444;
      cursor:pointer;
      font-size:15px;
    }

    .task{
      background:#f8fafc;
      padding:15px;
      border-radius:12px;
      margin-bottom:12px;

      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .task-left{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .task-left input{
      width:18px;
      height:18px;
      cursor:pointer;
    }

    .completed{
      text-decoration:line-through;
      color:#94a3b8;
    }

    .icons{
      display:flex;
      gap:12px;
    }

    .icons i{
      cursor:pointer;
      color:#64748b;
      transition:0.3s;
    }

    .icons i:hover{
      color:#2563eb;
    }

    .stats{
      text-align:center;
      margin-top:20px;
      color:#64748b;
      font-size:15px;
    }

    .footer{
      text-align:center;
      margin-top:20px;
      color:#94a3b8;
      font-size:14px;
    }

    @media(max-width:600px){

      .input-section{
        flex-direction:column;
      }

      .input-section button{
        width:100%;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <!-- TITLE -->

    <div class="title">

      <h1>
        Task Manager App
      </h1>

    </div>

    <!-- INPUT -->

    <div class="input-section">

      <input
        type="text"
        id="taskInput"
        placeholder="Task Name"
      >

      <input 
        type="text" 
        id="Task Description" 
        placeholder="Task Description"
      >
      <button onclick="addTask()">

        Add Task

      </button>

    </div>

    <!-- TASK HEADER -->

    <div class="task-header">

      <h3>
        <i class="fa-solid fa-list"></i>
        Your Tasks
      </h3>

      <button
        class="clear-btn"
        onclick="clearTasks()"
      >

        Clear All

      </button>

    </div>

    <!-- TASK LIST -->

    <div id="taskList"></div>

    <!-- STATS -->

    <div class="stats" id="stats">

      Completed: 0 of 0 Tasks

    </div>

  </div>

  <script>

    // ARRAY

    let tasks =
      JSON.parse(localStorage.getItem("tasks")) || [];

    // DISPLAY TASKS

    function displayTasks(){

      const taskList =
        document.getElementById("taskList");

      taskList.innerHTML = "";

      // MAP METHOD

      tasks.map((task,index)=>{

        const taskDiv =
          document.createElement("div");

        taskDiv.classList.add("task");

        taskDiv.innerHTML = `

          <div class="task-left">

            <input
              type="checkbox"
              ${task.completed ? "checked" : ""}
              onchange="toggleTask(${index})"
            >

            <span class="${
              task.completed
              ? "completed"
              : ""
            }">

              ${task.name}

            </span>

          </div>

          <div class="icons">

            <i
              class="fa-solid fa-trash"
              onclick="deleteTask(${index})"
            ></i>

          </div>

        `;

        taskList.appendChild(taskDiv);

      });

      updateStats();

    }

    // ADD TASK

    function addTask(){

      const taskInput =
        document.getElementById("taskInput");

      const taskName =
        taskInput.value.trim();

      // VALIDATION

      if(taskName === ""){

        alert("Please Enter Task");

        return;

      }

      // OBJECT

      const task = {

        id: Date.now(),

        name: taskName,

        completed: false

      };

      // PUSH

      tasks.push(task);

      // LOCAL STORAGE

      localStorage.setItem(

        "tasks",

        JSON.stringify(tasks)

      );

      displayTasks();

      taskInput.value = "";

    }

    // TOGGLE COMPLETE

    function toggleTask(index){

      tasks[index].completed =
        !tasks[index].completed;

      localStorage.setItem(

        "tasks",

        JSON.stringify(tasks)

      );

      displayTasks();

    }

    // DELETE TASK

    function deleteTask(index){

      // FILTER METHOD

      tasks = tasks.filter(

        (task,i)=> i !== index

      );

      localStorage.setItem(

        "tasks",

        JSON.stringify(tasks)

      );

      displayTasks();

    }

    // CLEAR ALL TASKS

    function clearTasks(){

      tasks = [];

      localStorage.removeItem("tasks");

      displayTasks();

    }

    // UPDATE STATS

    function updateStats(){

      const total =
        tasks.length;

      const completed =
        tasks.filter(
          task => task.completed
        ).length;

      document.getElementById("stats")
      .innerText =

      `Completed: ${completed} of ${total} Tasks`;

    }

    // INITIAL DISPLAY

    displayTasks();

  </script>

</body>

</html>
